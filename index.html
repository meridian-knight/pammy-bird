    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Pammy Bird",
        "url": "https://meridian-knight.github.io/pammy-bird/",
        "image": "https://meridian-knight.github.io/pammy-bird/social-preview-v3.png",
        "description": "Tap to flap, thread the gaps and beat your best. A free retro arcade fan game inspired by Flappy Bird, for desktop and mobile. Built by CyberSquad0 + Claude.",
        "genre": "Arcade",
        "gamePlatform": "Web browser",
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "inLanguage": "en",
        "author": { "@type": "Organization", "name": "CyberSquad0", "url": "https://www.cs0.dev" }
      }
    </script>
  </head>
  <body data-status="idle">
    <main class="handheld">
      <header class="hud">
        <div class="brand">
          <canvas id="hud-mascot" class="hud-mascot" width="32" height="20" aria-hidden="true"></canvas>
          <h1 class="title">Pammy Bird</h1>
        </div>
        <dl class="scoreboard" aria-label="Scoreboard">
          <div class="stat"><dt>Score</dt><dd id="score">0</dd></div>
          <div class="stat"><dt>Best</dt><dd id="best">0</dd></div>
        </dl>
        <div class="hud-buttons">
          <button id="help-btn" class="chip" type="button" aria-label="How to play" aria-haspopup="dialog" aria-expanded="false" aria-controls="help" title="How to play">?</button>
          <button id="pause-btn" class="chip" type="button" aria-label="Pause" title="Pause (P)" disabled>❚❚</button>
          <button id="mute-btn" class="chip" type="button" aria-label="Mute sound" aria-pressed="false" title="Toggle sound">🔊</button>
        </div>
      </header>

      <section class="screen" id="screen">
        <canvas id="board" width="300" height="400" aria-label="Game screen"></canvas>
        <p id="hover-hint" class="hover-hint" aria-live="polite" hidden></p>

        <div id="overlay" class="overlay" role="dialog" aria-labelledby="overlay-title">
          <div class="overlay-inner">
            <canvas id="mascot" class="mascot" width="96" height="96" aria-hidden="true"></canvas>
            <p class="eyebrow" id="overlay-eyebrow">Unofficial fan game</p>
            <h2 id="overlay-title">Pammy Bird</h2>
            <p id="overlay-text" class="overlay-text"></p>
            <p id="overlay-keys" class="keys"></p>
            <div id="overlay-controls" class="controls"></div>
            <button id="action-btn" class="action" type="button">Start</button>
            <p id="overlay-hint" class="hint-line" hidden></p>
          </div>
        </div>
      </section>

      <section class="deck" id="deck" aria-label="Game controls">
        <div class="deck-left" id="deck-left"></div>
      </section>

      <div id="help" class="modal" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
        <div class="modal-panel">
          <h2 id="help-title">How to play</h2>
          <div id="help-controls" class="controls"></div>
          <ul class="rules">
            <li>Tap, click or press Space to flap.</li>
            <li>Fly through the gap in every stack to score.</li>
            <li>Avoid the stacks and the ground.</li>
          </ul>
          <button id="help-close" class="action" type="button">Close</button>
        </div>
      </div>

      <footer class="foot">
        <p class="legal">A FAN GAME BUILT BY <a class="credit-link" href="https://www.cs0.dev" target="_blank" rel="noopener">CYBER SQUAD ZERO</a> + CLAUDE.</p>
        <p class="legal">Not affiliated with or endorsed by Anthropic.</p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
